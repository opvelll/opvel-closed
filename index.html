<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Opvelのブログは運営を終了しました。これまでご覧いただき、ありがとうございました。">
    <meta name="theme-color" content="#f7f8f5">
    <title>運営終了のお知らせ | Opvelのブログ</title>
    <style>
      * { box-sizing: border-box; }
      html { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #f7f8f5;
        color: #243e37;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { width: min(100%, 720px); padding: 72px 40px; }
      .brand { margin: 0 0 72px; font-size: 23px; font-weight: 700; letter-spacing: -0.8px; }
      .status { display: flex; align-items: center; gap: 10px; margin: 0 0 24px; color: #556b60; font-size: 12px; font-weight: 600; letter-spacing: 1.6px; }
      .status::before { content: ""; width: 8px; height: 8px; border: 1.5px solid currentColor; border-radius: 50%; }
      h1 { margin: 0; font-size: clamp(28px, 4.8vw, 40px); line-height: 1.65; letter-spacing: 0.025em; font-weight: 650; }
      .message { margin: 26px 0 36px; color: #59635d; font-size: 15px; line-height: 2.1; }
      a { display: inline-flex; align-items: center; gap: 24px; min-height: 48px; padding: 12px 20px; border: 1px solid #243e37; border-radius: 4px; color: #fff; background: #243e37; font-size: 14px; font-weight: 600; line-height: 1.6; text-decoration: none; }
      a:hover { background: #38594c; border-color: #38594c; }
      a:focus-visible { outline: 3px solid #7c9e72; outline-offset: 5px; }
      .arrow { font-size: 18px; font-weight: 400; }
      footer { margin-top: 72px; padding-top: 22px; border-top: 1px solid #d9ded6; color: #6b756c; font-size: 12px; letter-spacing: 0.04em; }
      @media (max-width: 480px) {
        main { padding: 48px 24px; }
        .brand { margin-bottom: 56px; }
        .message { font-size: 14px; }
        footer { margin-top: 56px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">opvel.</p>
      <p class="status">運営終了のお知らせ</p>
      <h1>Opvelのブログは<br>運営を終了しました。</h1>
      <p class="message">これまでご覧いただき、<br>ありがとうございました。</p>
      <a href="https://github.com/opvelll">GitHubプロフィール<span class="arrow" aria-hidden="true">↗</span></a>
      <footer>Opvelのブログ · opvel.com</footer>
    </main>
  </body>
</html>
